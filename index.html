<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Defter - Repertoire App</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#121212" />

  <!-- externe Bibliotheken für DOCX, PDF und HTML Sanitization -->
  <script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.1.15/dist/docx-preview.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #1e1e1e;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
    }
    h1 { font-size: 1.2rem; color: #fff; }
    .controls { display: flex; gap: 8px; }
    button, label.btn {
      background-color: #2c2c2e;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    button:active, label.btn:active { background-color: #3a3a3c; }
    input[type="file"] { display: none; }

    #main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 57px);
      overflow: hidden;
    }
    #sidebar {
      width: 300px;
      background-color: #181818;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
    }
    #search-box {
      padding: 10px;
      border-bottom: 1px solid #2a2a2a;
    }
    #search-input {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
    }
    #file-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }
    #file-list li {
      padding: 12px 16px;
      border-bottom: 1px solid #222;
      cursor: pointer;
      font-size: 0.95rem;
      word-break: break-word;
    }
    #file-list li:hover, #file-list li.active {
      background-color: #2a2a2d;
      color: #0a84ff;
    }
    #viewer {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background-color: #121212;
      color: #fff;
      font-size: 1.2rem;
      line-height: 1.6;
    }
    .text-content {
      white-space: pre-wrap;
      font-family: monospace;
    }
    .error-msg {
      color: #ff453a;
      background: rgba(255, 69, 58, 0.1);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ff453a;
    }
    /* docx-preview Dark Mode Overrides */
    .docx-wrapper { background: transparent !important; padding: 0 !important; }
    .docx-wrapper > section.docx {
      background: #1e1e1e !important;
      color: #fff !important;
      box-shadow: none !important;
      margin-bottom: 20px !important;
    }
  </style>
</head>
<body>

  <header>
    <h1>Defter Song Reader</h1>
    <div class="controls">
      <label class="btn" for="file-input">Dateien importieren</label>
      <!-- Erweitertes accept Attribute für DOC, DOCX, TXT, RTF, HTML, PDF -->
      <input type="file" id="file-input" multiple accept=".txt,.rtf,.doc,.docx,.html,.htm,.pdf" />
      <button id="btn-new-song">+ Neuer Song</button>
    </div>
  </header>

  <div id="main-container">
    <div id="sidebar">
      <div id="search-box">
        <input type="text" id="search-input" placeholder="Song suchen..." />
      </div>
      <ul id="file-list"></ul>
    </div>
    <div id="viewer">
      <p style="color: #666;">Wähle einen Song aus der Liste aus.</p>
    </div>
  </div>

  <script>
    // pdf.js worker set
    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    const songsMap = new Map(); // Speichert id -> { file, name, ext }
    const fileInput = document.getElementById('file-input');
    const fileListEl = document.getElementById('file-list');
    const viewerEl = document.getElementById('viewer');
    const searchInput = document.getElementById('search-input');

    fileInput.addEventListener('change', handleFilesSelect);
    searchInput.addEventListener('input', renderFileList);

    function handleFilesSelect(e) {
      const files = e.target.files;
      for (let file of files) {
        const id = file.name + '_' + file.size + '_' + file.lastModified;
        const ext = file.name.split('.').pop().toLowerCase();
        songsMap.set(id, { id, name: file.name, file, ext });
      }
      renderFileList();
    }

    function renderFileList() {
      const filter = searchInput.value.toLowerCase();
      fileListEl.innerHTML = '';

      songsMap.forEach((song) => {
        if (song.name.toLowerCase().includes(filter)) {
          const li = document.createElement('li');
          li.textContent = song.name;
          li.onclick = () => {
            document.querySelectorAll('#file-list li').forEach(el => el.classList.remove('active'));
            li.classList.add('active');
            displaySong(song);
          };
          fileListEl.appendChild(li);
        }
      });
    }

    async function displaySong(song) {
      viewerEl.innerHTML = '<p style="color:#888;">Lade Song...</p>';

      try {
        const ext = song.ext;

        if (ext === 'txt') {
          const text = await song.file.text();
          renderText(text);
        }
        else if (ext === 'html' || ext === 'htm') {
          const htmlContent = await song.file.text();
          renderHtml(htmlContent);
        }
        else if (ext === 'rtf') {
          const rtfRaw = await song.file.text();
          const parsedText = parseRTF(rtfRaw);
          renderText(parsedText);
        }
        else if (ext === 'docx') {
          await renderDOCX(song.file);
        }
        else if (ext === 'doc') {
          await renderBinaryDOC(song.file);
        }
        else if (ext === 'pdf') {
          await renderPDF(song.file);
        }
        else {
          viewerEl.innerHTML = `<div class="error-msg">Format .${ext} wird nicht unterstützt.</div>`;
        }
      } catch (err) {
        console.error(err);
        viewerEl.innerHTML = `<div class="error-msg">Fehler beim Laden der Datei: ${err.message}</div>`;
      }
    }

    // --- RENDER-FUNKTIONEN ---

    function renderText(text) {
      const div = document.createElement('div');
      div.className = 'text-content';
      div.textContent = text;
      viewerEl.innerHTML = '';
      viewerEl.appendChild(div);
    }

    function renderHtml(htmlContent) {
      // Entfernt potenziell schädliche Skripts vor dem Einfügen
      const cleanHtml = htmlContent.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
      viewerEl.innerHTML = cleanHtml;
    }

    // Behebt den DOCX-Buffer-Fehler (erzeugt bei jedem Aufruf ein frisches ArrayBuffer)
    async function renderDOCX(file) {
      const buffer = await file.arrayBuffer();

      // Mammoth Versuch für schnelle HTML-Darstellung
      try {
        // .slice(0) verhindert, dass der Puffer unbrauchbar wird
        const result = await mammoth.convertToHtml({ arrayBuffer: buffer.slice(0) });
        if (result.value && result.value.trim().length > 0) {
          viewerEl.innerHTML = result.value;
          return;
        }
      } catch (mErr) {
        console.warn('Mammoth-Konvertierung fehlgeschlagen, versuche docx-preview...', mErr);
      }

      // Fallback auf docx-preview
      viewerEl.innerHTML = '<div id="docx-container"></div>';
      const container = document.getElementById('docx-container');
      await docx.renderAsync(buffer.slice(0), container);
    }

    // Parser für ältere binäre .doc-Dateien (Word 97-2003)
    async function renderBinaryDOC(file) {
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);

      // Auslesen von lesbarem ASCII/UTF-16 Text aus binärem Stream
      let extractedText = '';
      let currentStr = '';

      for (let i = 0; i < bytes.length; i++) {
        const charCode = bytes[i];
        // Filtere druckbare Zeichen & Zeilenumbrüche
        if ((charCode >= 32 && charCode <= 126) || charCode === 10 || charCode === 13) {
          currentStr += String.fromCharCode(charCode);
        } else if (bytes[i] === 0 && bytes[i+1] >= 32 && bytes[i+1] <= 126) {
          // UTF-16LE Unterstützung
          currentStr += String.fromCharCode(bytes[i+1]);
          i++;
        } else {
          if (currentStr.trim().length > 3) {
            // Vermeidet binären Müll
            if (!currentStr.includes('WordDocument') && !currentStr.includes('Root Entry') && !currentStr.includes('CompObj')) {
              extractedText += currentStr + '\n';
            }
          }
          currentStr = '';
        }
      }
      if (currentStr.trim().length > 3) {
        extractedText += currentStr;
      }

      if (extractedText.trim().length === 0) {
        throw new Error("Der Text aus der älteren .doc-Datei konnte nicht extrahiert werden.");
      }

      renderText(extractedText);
    }

    // Einfacher RTF-Parser zur Text-Extraktion
    function parseRTF(rtf) {
      return rtf
        .replace(/\\par[d]?/g, '\n')
        .replace(/\\tab/g, '\t')
        .replace(/\\'[0-9a-fA-F]{2}/g, (match) => {
          return String.fromCharCode(parseInt(match.substring(2), 16));
        })
        .replace(/{\\[*][^}]+}/g, '')
        .replace(/\\[a-zA-Z]+-?\d* ?/g, '')
        .replace(/[{}]/g, '')
        .trim();
    }

    // PDF Rendering
    async function renderPDF(file) {
      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      viewerEl.innerHTML = '';

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 1.5 });
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        canvas.style.maxWidth = '100%';
        canvas.style.marginBottom = '20px';

        await page.render({ canvasContext: context, viewport: viewport }).promise;
        viewerEl.appendChild(canvas);
      }
    }
  </script>
</body>
</html>
