<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Defter - Repertoire App</title>
  <link rel="manifest" href="manifest.webmanifest" />
  <link rel="apple-touch-icon" href="apple-touch-icon.png" />
  <meta name="theme-color" content="#121212" />

  <!-- externe Bibliotheken -->
  <script src="https://unpkg.com/mammoth@1.6.0/mammoth.browser.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/docx-preview@0.1.15/dist/docx-preview.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #121212;
      color: #e0e0e0;
      display: flex;
      flex-direction: column;
      height: 100vh;
      overflow: hidden;
    }
    header {
      background-color: #1e1e1e;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #333;
    }
    h1 { font-size: 1.2rem; color: #fff; }
    .controls { display: flex; gap: 8px; }
    button, label.btn {
      background-color: #2c2c2e;
      color: #fff;
      border: 1px solid #444;
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-size: 0.9rem;
      display: inline-block;
    }
    button:active, label.btn:active { background-color: #3a3a3c; }
    input[type="file"] { display: none; }

    #main-container {
      display: flex;
      flex: 1;
      height: calc(100vh - 57px);
      overflow: hidden;
    }
    #sidebar {
      width: 300px;
      background-color: #181818;
      border-right: 1px solid #2a2a2a;
      display: flex;
      flex-direction: column;
    }
    #search-box {
      padding: 10px;
      border-bottom: 1px solid #2a2a2a;
    }
    #search-input {
      width: 100%;
      padding: 8px;
      border-radius: 4px;
      border: 1px solid #333;
      background: #222;
      color: #fff;
    }
    #file-list {
      list-style: none;
      overflow-y: auto;
      flex: 1;
    }
    #file-list li {
      padding: 12px 16px;
      border-bottom: 1px solid #222;
      cursor: pointer;
      font-size: 0.95rem;
      word-break: break-word;
    }
    #file-list li:hover, #file-list li.active {
      background-color: #2a2a2d;
      color: #0a84ff;
    }
    #viewer {
      flex: 1;
      padding: 20px;
      overflow-y: auto;
      background-color: #121212;
      color: #fff;
      font-size: 1.2rem;
      line-height: 1.6;
    }
    .text-content {
      white-space: pre-wrap;
      font-family: monospace;
      font-size: 1.1rem;
    }
    .error-msg {
      color: #ff453a;
      background: rgba(255, 69, 58, 0.1);
      padding: 12px;
      border-radius: 6px;
      border: 1px solid #ff453a;
    }
    /* docx-preview Dark Mode Styles */
    .docx-wrapper { background: transparent !important; padding: 0 !important; }
    .docx-wrapper > section.docx {
      background: #1e1e1e !important;
      color: #fff !important;
      box-shadow: none !important;
      margin-bottom: 20px !important;
    }
  </style>
</head>
<body>

  <header>
    <h1>Defter Song Reader</h1>
    <div class="controls">
      <label class="btn" for="file-input">Dateien importieren</label>
      <!-- Umfassendes accept-Attribut für Betriebssysteme (MIME-Types + Endungen) -->
      <input type="file" id="file-input" multiple accept=".txt,.rtf,.doc,.docx,.html,.htm,.pdf,text/plain,text/rtf,text/html,application/msword,application/vnd.openxmlformats-officedocument.wordprocessingml.document,application/pdf,application/rtf" />
      <button id="btn-new-song">+ Neuer Song</button>
    </div>
  </header>

  <div id="main-container">
    <div id="sidebar">
      <div id="search-box">
        <input type="text" id="search-input" placeholder="Song suchen..." />
      </div>
      <ul id="file-list"></ul>
    </div>
    <div id="viewer">
      <p style="color: #666;">Wähle einen Song aus der Liste aus.</p>
    </div>
  </div>

  <script>
    if ('serviceWorker' in navigator) {
      navigator.serviceWorker.register('sw.js').catch(err => console.log('SW reg error:', err));
    }

    pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';

    // Map speichert die geladenen Dateien im Arbeitsspeicher
    const songsMap = new Map();
    const fileInput = document.getElementById('file-input');
    const fileListEl = document.getElementById('file-list');
    const viewerEl = document.getElementById('viewer');
    const searchInput = document.getElementById('search-input');

    fileInput.addEventListener('change', handleFilesSelect);
    searchInput.addEventListener('input', renderFileList);

    function handleFilesSelect(e) {
      const files = e.target.files;
      for (let file of files) {
        const id = file.name + '_' + file.size + '_' + file.lastModified;
        const ext = file.name.split('.').pop().toLowerCase();

        // Speichere die Original-Datei unberührt
        songsMap.set(id, { id, name: file.name, file, ext });
      }
      renderFileList();
    }

    function renderFileList() {
      const filter = searchInput.value.toLowerCase();
      fileListEl.innerHTML = '';

      songsMap.forEach((song) => {
        if (song.name.toLowerCase().includes(filter)) {
          const li = document.createElement('li');
          li.textContent = song.name;
          li.onclick = () => {
            document.querySelectorAll('#file-list li').forEach(el => el.classList.remove('active'));
            li.classList.add('active');
            displaySong(song);
          };
          fileListEl.appendChild(li);
        }
      });
    }

    async function displaySong(song) {
      viewerEl.innerHTML = '<p style="color:#888;">Lade Song...</p>';

      try {
        const ext = song.ext;

        if (ext === 'txt') {
          const text = await song.file.text();
          renderText(text);
        }
        else if (ext === 'html' || ext === 'htm') {
          const htmlContent = await song.file.text();
          renderHtml(htmlContent);
        }
        else if (ext === 'rtf') {
          const rtfRaw = await song.file.text();
          const parsedText = parseRTF(rtfRaw);
          renderText(parsedText);
        }
        else if (ext === 'docx') {
          await renderDOCX(song.file);
        }
        else if (ext === 'doc') {
          await renderBinaryDOC(song.file);
        }
        else if (ext === 'pdf') {
          await renderPDF(song.file);
        }
        else {
          // Fallback: versuche Textanzeige
          const rawText = await song.file.text();
          renderText(rawText);
        }
      } catch (err) {
        console.error(err);
        viewerEl.innerHTML = `<div class="error-msg">Fehler beim Laden: ${err.message}</div>`;
      }
    }

    // --- ANZEIGE-LOGIK ---

    function renderText(text) {
      const div = document.createElement('div');
      div.className = 'text-content';
      div.textContent = text;
      viewerEl.innerHTML = '';
      viewerEl.appendChild(div);
    }

    function renderHtml(htmlContent) {
      const cleanHtml = htmlContent.replace(/<script\b[^<]*(?:(?!<\/script>)<[^<]*)*<\/script>/gi, '');
      viewerEl.innerHTML = cleanHtml;
    }

    // Behebt den DOCX-Puffer-Fehler
    async function renderDOCX(file) {
      const buffer = await file.arrayBuffer();

      try {
        // buffer.slice(0) schützt den Hauptpuffer im State
        const result = await mammoth.convertToHtml({ arrayBuffer: buffer.slice(0) });
        if (result.value && result.value.trim().length > 0) {
          viewerEl.innerHTML = result.value;
          return;
        }
      } catch (mErr) {
        console.warn('Mammoth konnte DOCX nicht rendern, nutze docx-preview...', mErr);
      }

      viewerEl.innerHTML = '<div id="docx-container"></div>';
      const container = document.getElementById('docx-container');
      await docx.renderAsync(buffer.slice(0), container);
    }

    // Auslesen alter Word .doc-Dateien (Word 97-2003)
    async function renderBinaryDOC(file) {
      const buffer = await file.arrayBuffer();
      const bytes = new Uint8Array(buffer);

      let text = '';
      let chunk = '';

      for (let i = 0; i < bytes.length; i++) {
        const b = bytes[i];
        // Standard ASCII / Zeilenumbrüche
        if ((b >= 32 && b <= 126) || b === 10 || b === 13 || b === 9) {
          chunk += String.fromCharCode(b);
        } else if (b === 0 && i + 1 < bytes.length && bytes[i+1] >= 32 && bytes[i+1] <= 126) {
          // UTF-16 Unicode
          chunk += String.fromCharCode(bytes[i+1]);
          i++;
        } else {
          if (chunk.trim().length > 2) {
            // Ausfiltern interner Word-Metadaten
            if (!chunk.includes('WordDocument') && !chunk.includes('Root Entry') && !chunk.includes('CompObj') && !chunk.includes('ObjectPool')) {
              text += chunk + '\n';
            }
          }
          chunk = '';
        }
      }
      if (chunk.trim().length > 2) text += chunk;

      if (!text.trim()) {
        // Zweiter Fallback: UTF-8 Text-Read
        text = await file.text();
        text = text.replace(/[\x00-\x08\x0B\x0C\x0E-\x1F\x7F-\x9F]/g, '');
      }

      renderText(text);
    }

    // RTF Steuerzeichen-Stripper
    function parseRTF(rtf) {
      return rtf
        .replace(/\\par[d]?/g, '\n')
        .replace(/\\tab/g, '\t')
        .replace(/\\'[0-9a-fA-F]{2}/g, (m) => String.fromCharCode(parseInt(m.substring(2), 16)))
        .replace(/{\\[*][^}]+}/g, '')
        .replace(/\\[a-zA-Z]+-?\d* ?/g, '')
        .replace(/[{}]/g, '')
        .trim();
    }

    // PDF Renderer
    async function renderPDF(file) {
      const buffer = await file.arrayBuffer();
      const pdf = await pdfjsLib.getDocument({ data: buffer }).promise;
      viewerEl.innerHTML = '';

      for (let i = 1; i <= pdf.numPages; i++) {
        const page = await pdf.getPage(i);
        const viewport = page.getViewport({ scale: 1.5 });
        const canvas = document.createElement('canvas');
        const context = canvas.getContext('2d');
        canvas.height = viewport.height;
        canvas.width = viewport.width;
        canvas.style.maxWidth = '100%';
        canvas.style.marginBottom = '20px';

        await page.render({ canvasContext: context, viewport: viewport }).promise;
        viewerEl.appendChild(canvas);
      }
    }
  </script>
</body>
</html>
